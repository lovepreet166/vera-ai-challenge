# fly.toml app configuration file generated for vera-lovepreet

app = 'vera-lovepreet'
primary_region = 'sin'

[build]

[env]
  VERA_TEAM_NAME = 'Lovepreet'
  VERA_TEAM_MEMBERS = 'Lovepreet Singh'
  VERA_CONTACT_EMAIL = 'lovepreetsingh40888@gmail.com'
  VERA_LLM_PROVIDER = 'groq'
  VERA_LLM_MODEL = 'llama-3.3-70b-versatile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/v1/healthz'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
